<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi-websocket</title>
<style>
	:root {
		--bg: #0d0d10; --panel: #17171c; --border: #2c2c34;
		--text: #e8e8ec; --muted: #9a9aa6; --dim: #6a6a76;
		--accent: #7f77dd; --success: #1d9e75; --error: #e24b4a; --warning: #ef9f27;
		--user-bg: #232338; --user-text: #e8e8ec;
		--tool-title: #85b7eb; --tool-output: #b4b2a9; --tool-pending-bg: #26262e;
		--tool-success-bg: #14201b; --tool-error-bg: #2a1516;
		--thinking: #8f8f9c; --code-bg: #101014; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; margin: 0; }
	body {
		background: var(--bg); color: var(--text);
		font: 13px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
		display: flex; flex-direction: column;
	}
	header {
		display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
		padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
	}
	header .title { font-weight: 600; color: var(--accent); }
	header .meta { color: var(--muted); font-size: 12px; }
	header .spacer { flex: 1; }
	.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--error); display: inline-block; }
	.dot.on { background: var(--success); }
	select, button, textarea {
		font: inherit; color: var(--text); background: var(--panel);
		border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
	}
	button { cursor: pointer; }
	button:hover { border-color: var(--accent); }
	#ctlbar {
		display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
		padding: 6px 14px; border-bottom: 1px solid var(--border); background: var(--bg);
	}
	#ctlbar button, #ctlbar select { font-size: 12px; padding: 3px 8px; }
	#ctlbar select { max-width: 260px; }
	#ctlbar .ctx { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
	#ctlbar .sep { width: 1px; height: 18px; background: var(--border); }
	#stream {
		flex: 1; overflow-y: auto; padding: 14px 16px 24px;
		display: flex; flex-direction: column; gap: 10px;
	}
	.msg { max-width: 92%; border-radius: 10px; padding: 8px 12px; white-space: normal; word-break: break-word; }
	.msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-text); white-space: pre-wrap; }
	.msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
	.msg.note { align-self: center; color: var(--dim); font-size: 12px; background: none; border: none; padding: 2px; }
	.msg .model-tag { color: var(--dim); font-size: 11px; margin-bottom: 4px; }
	.msg .usage { color: var(--dim); font-size: 11px; margin-top: 6px; border-top: 1px dashed var(--border); padding-top: 4px; }
	details.think { margin: 4px 0; }
	details.think summary { cursor: pointer; color: var(--thinking); font-size: 12px; user-select: none; }
	details.think .body { color: var(--thinking); font-size: 12px; white-space: pre-wrap; border-left: 2px solid var(--border); padding-left: 8px; margin-top: 4px; }
	.md h1, .md h2, .md h3 { margin: 0.5em 0 0.25em; font-size: 1.05em; }
	.md p { margin: 0.3em 0; }
	.md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; overflow-x: auto; font-family: var(--mono); font-size: 12px; }
	.md code { font-family: var(--mono); font-size: 12px; background: var(--code-bg); border-radius: 4px; padding: 1px 5px; }
	/* markdown 表格：与终端里的表格等价，不再把 | 当普通文字挤成一团 */
	.md table { border-collapse: collapse; margin: 6px 0; width: 100%; font-size: 12.5px; }
	/* 有表格的气泡允许变宽，否则表格会在窄气泡里被挤成一堆 */
	.msg:has(.md table) { width: min(92%, 860px); }
	.md th, .md td { border: 1px solid var(--border); padding: 4px 8px; vertical-align: top; text-align: left; min-width: 44px; }
	.md th { background: var(--code-bg); font-weight: 600; white-space: nowrap; }
	.md td { word-break: normal; overflow-wrap: anywhere; }
	.md tr:nth-child(even) td { background: rgba(255,255,255,0.025); }
	.md th.a-center, .md td.a-center { text-align: center; }
	.md th.a-right, .md td.a-right { text-align: right; }
	.md th.a-left, .md td.a-left { text-align: left; }
	.md .tablewrap { overflow-x: auto; max-width: 100%; }
	.md pre code { background: none; padding: 0; }
	.md ul, .md ol { margin: 0.3em 0; padding-left: 1.4em; }
	.tool { align-self: flex-start; width: 92%; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--tool-pending-bg); }
	.tool.ok { background: var(--tool-success-bg); }
	.tool.err { background: var(--tool-error-bg); }
	.tool .head { display: flex; align-items: center; gap: 8px; padding: 5px 10px; cursor: pointer; }
	.tool .name { color: var(--tool-title); font-family: var(--mono); font-size: 12px; font-weight: 600; }
	.tool .state { margin-left: auto; font-size: 11px; color: var(--muted); }
	.tool .state.err { color: var(--error); }
	.tool .body { display: none; padding: 0 10px 8px; }
	.tool.open .body { display: block; }
	.tool pre { margin: 4px 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; overflow-x: auto; font-family: var(--mono); font-size: 11.5px; color: var(--tool-output); max-height: 320px; overflow-y: auto; white-space: pre-wrap; }
	/* 新内容不抢滚动：用户往上翻时给一个「跳到最新」按钮 */
	#jump { position: fixed; right: 18px; bottom: 150px; z-index: 40; display: none; padding: 6px 12px; border-radius: 999px; background: var(--accent); color: #fff; border: 1px solid var(--border); font-size: 12px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.30); }
	#jump.show { display: block; }
	.live-cursor { display: inline-block; width: 7px; height: 14px; background: var(--accent); animation: blink 0.9s steps(2) infinite; vertical-align: text-bottom; }
	@keyframes blink { 50% { opacity: 0; } }
	footer { display: flex; gap: 8px; padding: 10px 14px; background: var(--panel); border-top: 1px solid var(--border); align-items: flex-end; }
	footer textarea { flex: 1; resize: none; min-height: 40px; max-height: 140px; font-family: inherit; }
	footer .col { display: flex; flex-direction: column; gap: 4px; }
	footer label { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
	#send { background: var(--accent); color: #fff; border: none; padding: 8px 18px; font-weight: 600; }
	#attachRow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 14px; background: var(--panel); border-top: 1px solid var(--border); }
	#attachRow button { font-size: 12px; padding: 3px 10px; }
	#attachRow .hint { color: var(--dim); font-size: 11px; }
	#chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
	.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 11px; color: var(--muted); background: var(--bg); max-width: 280px; }
	.chip b { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
	.chip button { border: none; background: none; color: var(--muted); padding: 0 4px; font-size: 14px; line-height: 1; }
	.chip button:hover { color: var(--error); }
	.msg img, .filecard img { max-width: 100%; max-height: 380px; height: auto; border-radius: 8px; display: block; margin: 4px 0; }
	.filecard { align-self: flex-start; max-width: 92%; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; background: var(--panel); }
	.filecard a { color: var(--accent); text-decoration: none; }
	.filecard .sub, .msg .sub { color: var(--dim); font-size: 11px; }
	@media (max-width: 860px) {
		html, body { height: 100dvh; }
		header { gap: 8px; padding: 6px 10px; }
		header .meta { font-size: 11px; }
		#ctlbar { padding: 6px 10px; gap: 6px; }
		#ctlbar select { max-width: 46vw; flex: 1 1 40%; min-height: 34px; }
		#ctlbar button { flex: 1 1 auto; min-height: 34px; }
		#ctlbar .hideNarrow { display: none; }
		#stream { padding: 10px 10px 16px; }
		.msg, .tool, .filecard { max-width: 100%; }
		footer { flex-wrap: wrap; padding: 8px 10px; gap: 6px; }
		footer textarea { flex: 1 1 100%; min-height: 44px; font-size: 15px; }
		footer .col { flex-direction: row; width: 100%; }
		#send { min-height: 42px; flex: 1; }
		#attachRow { padding: 6px 10px; }
	}
	@media (max-width: 520px) {
		body { font-size: 14px; }
		#ctlbar button, #ctlbar select { font-size: 13px; min-height: 38px; }
		.msg img, .filecard img { max-height: 260px; }
		.tool pre { font-size: 12px; max-height: 220px; }
		header .title { font-size: 14px; }
	}
</style>
</head>
<body>
<header>
	<span class="title">pi-websocket</span>
	<span class="dot" id="conn"></span>
	<span class="meta" id="meta">connecting…</span>
	<span class="spacer"></span>
	<label class="meta"><input type="checkbox" id="streamToggle"> 流式 token</label>
	<select id="deliverAs" title="消息投递方式">
		<option value="steer">steer（插队）</option>
		<option value="followUp">followUp（排队）</option>
	</select>
	<button id="logout" title="退出登录">退出</button>
	<button id="clear">清屏</button>
</header>
<div id="ctlbar">
	<span class="ctx" id="ctx">ctx —</span>
	<span class="sep"></span>
	<select id="modelSel" title="切换模型"><option value="">模型…</option></select>
	<select id="thinkSel" title="思考强度">
		<option value="">thinking…</option>
		<option value="off">off</option>
		<option value="minimal">minimal</option>
		<option value="low">low</option>
		<option value="medium">medium</option>
		<option value="high">high</option>
		<option value="xhigh">xhigh</option>
		<option value="max">max</option>
	</select>
	<button id="btnState" title="刷新上下文/模型状态">状态</button>
	<button id="btnCompact" title="压缩上下文（/compact）">压缩</button>
	<button id="btnReload" title="重载扩展/技能/提示/主题（/reload）">重载</button>
	<button id="btnNew" title="开启新会话（/new）">新会话</button>
	<span class="ctx hideNarrow">以 / 或 ! 开头即为命令</span>
</div>
<div id="stream"></div>
<div id="attachRow">
	<button id="attach" title="上传附件：图片直接给模型看，其他文件给路径">📎 附件</button>
	<input type="file" id="filePick" multiple hidden>
	<span id="chips"></span>
	<span class="hint">图片直接进模型；其他文件传路径让模型读；也可直接粘贴图片</span>
</div>
<button id="jump" title="跳到最新输出">▼ 跳到最新</button>
<footer>
	<textarea id="input" placeholder="发送消息给 pi 会话…（可粘贴图片）" rows="2"></textarea>
	<div class="col">
		<button id="send">发送</button>
	</div>
</footer>
<script>
"use strict";
(() => {
	const $ = (id) => document.getElementById(id);
	const streamEl = $("stream");
	const inputEl = $("input");
	const metaEl = $("meta");
	const connEl = $("conn");
	const ctxEl = $("ctx");
	const modelSel = $("modelSel");
	const thinkSel = $("thinkSel");
	let ws = null;
	let backoff = 2000;
	let stuckToBottom = true;
	const toolCards = new Map(); // toolCallId -> {el, filled}

	/**
	 * Memory guards. A reconnect used to replay the whole session tail into the
	 * same container without clearing it, so a page left open across reconnects
	 * grew without bound and showed the same messages over again. Reconnect now
	 * resets the stream, and the DOM is capped so old nodes (and their tool
	 * cards) are actually released.
	 */
	const MAX_STREAM_NODES = 400;
	function resetStream() {
		streamEl.innerHTML = "";
		toolCards.clear();
		liveEl = null;
	}
	function trimStream() {
		let over = streamEl.childElementCount - MAX_STREAM_NODES;
		if (over <= 0) return;
		while (over-- > 0) {
			const first = streamEl.firstElementChild;
			if (!first) break;
			const tid = first.dataset.toolId;
			if (tid) toolCards.delete(tid);
			first.remove();
		}
		if (liveEl && !streamEl.contains(liveEl)) liveEl = null;
	}

	streamEl.addEventListener("scroll", () => {
		stuckToBottom = streamEl.scrollHeight - streamEl.scrollTop - streamEl.clientHeight < 40;
	});
	const scroll = () => { if (stuckToBottom) streamEl.scrollTop = streamEl.scrollHeight; };
	const jumpEl = document.getElementById("jump");
	const showJump = () => { if (jumpEl) jumpEl.classList.add("show"); };
	const hideJump = () => { if (jumpEl) jumpEl.classList.remove("show"); };
	// 有新内容：在底部就跟上，往上翻过就不抢滚动、只亮按钮
	const noteNewContent = () => { if (stuckToBottom) { scroll(); hideJump(); } else showJump(); };
	if (jumpEl) jumpEl.addEventListener("click", () => { stuckToBottom = true; streamEl.scrollTop = streamEl.scrollHeight; hideJump(); });

	// ---------- markdown (minimal, safe: escape first) ----------
	function esc(s) {
		return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
	}
	// GFM 风格管道表格：| a | b | 加第二行分隔线才算表格，孤立的 | 行不动
	function splitRow(s) {
		s = s.trim();
		if (s.startsWith("|")) s = s.slice(1);
		if (s.endsWith("|")) s = s.slice(0, -1);
		const cells = [];
		let cur = "";
		let inCode = false; // 反引号包起来的行内码里的 | 是正文，不是列分隔符
		for (let i = 0; i < s.length; i++) {
			const c = s[i];
			if (c === "`") { inCode = !inCode; cur += c; continue; }
			if (c === "\\" && s[i + 1] === "|") { cur += "|"; i++; continue; } // 无论是否在行内码里，\| 都算转义竖线
			if (!inCode && c === "|") { cells.push(cur.trim()); cur = ""; continue; }
			cur += c;
		}
		cells.push(cur.trim());
		return cells;
	}
	const TABLE_SEP = /^\|?\s*:?-{1,}:?\s*(?:\|\s*:?-{1,}:?\s*)+\|?$/;
	function inline(s) {
		s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
		s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
		return s;
	}
	function tableAlign(cells) {
		return cells.map((c) => {
			const l = c.startsWith(":"), r = c.endsWith(":");
			return l && r ? "center" : r ? "right" : l ? "left" : "";
		});
	}
	function tables(t) {
		const lines = t.split("\n");
		const out = [];
		let i = 0;
		const gap = () => { if (out.length && out[out.length - 1] !== "") out.push(""); };
		while (i < lines.length) {
			const line = lines[i], next = lines[i + 1];
			if (line.includes("|") && next && next.includes("-") && TABLE_SEP.test(next.trim())) {
				const head = splitRow(line);
				const align = tableAlign(splitRow(next));
				const n = Math.max(head.length, align.length);
				const rows = [];
				let j = i + 2;
				while (j < lines.length && lines[j].trim() !== "" && lines[j].includes("|")) { rows.push(splitRow(lines[j])); j++; }
				const pad = (r) => { const c = r.slice(0, n); while (c.length < n) c.push(""); return c; };
				const cell = (tag, txt, k) => `<${tag}${align[k] ? ` class="a-${align[k]}"` : ""}>${inline(txt)}</${tag}>`;
				let h = `<table><thead><tr>${pad(head).map((c, k) => cell("th", c, k)).join("")}</tr></thead><tbody>`;
				h += rows.map((r) => `<tr>${pad(r).map((c, k) => cell("td", c, k)).join("")}</tr>`).join("");
				h += "</tbody></table>";
				gap();
				out.push(`<div class="tablewrap">${h}</div>`);
				out.push("");
				i = j;
			} else { out.push(line); i++; }
		}
		return out.join("\n");
	}
	function md(src) {
		const parts = String(src ?? "").split(/```/);
		let out = "";
		parts.forEach((part, i) => {
			if (i % 2 === 1) {
				const nl = part.indexOf("\n");
				const lang = nl >= 0 ? part.slice(0, nl).trim() : "";
				const code = nl >= 0 ? part.slice(nl + 1) : part;
				out += `<pre><code data-lang="${esc(lang)}">${esc(code)}</code></pre>`;
			} else {
				let t = esc(part);
				// 顺序很重要：先切表格，再对单元格做行内格式。
				// 否则单元格里如 `|` 这样的行内码会先变成带裸竖线的 HTML，那一行会被错切。
				t = tables(t);
				t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
				t = t.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
				t = t.replace(/^### (.*)$/gm, "<h3>$1</h3>").replace(/^## (.*)$/gm, "<h2>$1</h2>").replace(/^# (.*)$/gm, "<h1>$1</h1>");
				t = t.replace(/^[-*] (.*)$/gm, "<li>$1</li>");
				t = t.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, "<ul>$1</ul>");
				t = tables(t);
				t = t.split(/\n{2,}/).map(p => /^<(h\d|ul|pre|table|div class="tablewrap")/.test(p.trim()) ? p : `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
				out += t;
			}
		});
		return out;
	}

	// ---------- rendering ----------
	function addMsg(cls, html) {
		const el = document.createElement("div");
		el.className = "msg " + cls;
		el.innerHTML = html;
		streamEl.appendChild(el);
		trimStream();
		noteNewContent();
		return el;
	}
	function note(text) { addMsg("note", esc(text)); }

	let liveEl = null; // streaming assistant bubble
	function liveBubble(create) {
		if (!liveEl && create) {
			liveEl = addMsg("assistant", '<span class="body md"></span><span class="live-cursor"></span>');
			liveEl._text = ""; liveEl._think = "";
		}
		return liveEl;
	}
	function renderLive() {
		if (!liveEl) return;
		let html = "";
		if (liveEl._think) html += `<details class="think" open><summary>思考中…</summary><div class="body">${esc(liveEl._think)}</div></details>`;
		html += `<div class="md">${md(liveEl._text)}</div>`;
		liveEl.querySelector(".body").innerHTML = html;
		scroll();
	}
	function closeLive() {
		if (liveEl) { liveEl.remove(); liveEl = null; }
	}

	function renderUser(m) {
	const imgs = (m.images || []).filter((i) => i.url).map((i) => `<img src="${esc(i.url)}" alt="${esc(i.mimeType || "image")}" loading="lazy">`).join("");
	addMsg("user", esc(m.text || "") + imgs);
}
	function renderCustom(m) { note(`[${m.customType ?? "custom"}] ${m.text ?? ""}`); }

	function renderAssistant(m, isFinal) {
		const tag = [];
		if (m.model) tag.push(`${m.provider ?? ""}/${m.responseModel ?? m.model}`);
		if (m.thinkingLevel) tag.push(`think:${m.thinkingLevel}`);
		let html = "";
		if (tag.length) html += `<div class="model-tag">${esc(tag.join(" · "))}</div>`;
		for (const b of m.blocks ?? []) {
			if (b.type === "text") html += `<div class="md">${md(b.text)}</div>`;
			else if (b.type === "thinking") {
				html += `<details class="think"><summary>思考过程</summary><div class="body">${esc(b.text)}</div></details>`;
			} else if (b.type === "toolCall") {
				ensureTool(b.id, b.name, b.arguments);
			}
		}
		if (m.errorMessage) html += `<div style="color:var(--error)">${esc(m.errorMessage)}</div>`;
		if (m.usage) {
			const u = m.usage;
			html += `<div class="usage">in ${u.input} · out ${u.output} · cache ${u.cacheRead}/${u.cacheWrite} · ${u.totalTokens} tok${u.costTotal != null ? ` · $${u.costTotal.toFixed(4)}` : ""}</div>`;
		}
		const el = addMsg("assistant", html || "<span style='color:var(--dim)'>(empty)</span>");
		el.querySelectorAll("details.think").forEach(d => d.open = false);
	}

	function ensureTool(id, name, args) {
		let card = toolCards.get(id);
		if (!card) {
			const el = document.createElement("div");
			el.className = "tool";
			el.dataset.toolId = id;
			el.innerHTML = `<div class="head"><span class="name">${esc(name)}</span><span class="state">pending</span></div><div class="body"></div>`;
			el.querySelector(".head").addEventListener("click", () => el.classList.toggle("open"));
			streamEl.appendChild(el);
			scroll();
			card = { el, filled: false };
			toolCards.set(id, card);
		}
		const body = card.el.querySelector(".body");
		if (args != null && !card.el.dataset.hasArgs) {
			card.el.dataset.hasArgs = "1";
			const pre = document.createElement("pre");
			pre.textContent = String(args);
			pre.dataset.role = "args";
			body.appendChild(pre);
		}
		return card;
	}
	function toolState(id, text, cls) {
		const card = toolCards.get(id);
		if (!card) return;
		const s = card.el.querySelector(".state");
		s.textContent = text;
		s.className = "state" + (cls ? " " + cls : "");
	}
	function toolClass(id, cls) {
		const card = toolCards.get(id);
		if (card) card.el.className = "tool " + cls + (card.el.classList.contains("open") ? " open" : "");
	}
	function fillToolResult(id, text, isError) {
		const card = ensureTool(id, "unknown", null);
		if (card.filled) return;
		card.filled = true;
		// Long tool output is the single biggest memory cost in a replayed session.
		// Medium-length output stays in the DOM but starts collapsed; oversized
		// output is truncated with an explicit marker instead of pasted in full.
		const body = card.el.querySelector(".body");
		const t = text || "(no output)";
		const COLLAPSE_OVER = 1200;
		const TRUNCATE_OVER = 20_000;
		const mkPre = (value) => {
			const pre = document.createElement("pre");
			pre.textContent = value;
			pre.dataset.role = "result";
			return pre;
		};
		if (t.length > TRUNCATE_OVER) {
			body.appendChild(mkPre(`${t.slice(0, COLLAPSE_OVER)}\n…[已截断，完整输出 ${t.length} 字符，可在会话文件里查看]`));
		} else if (t.length > COLLAPSE_OVER) {
			const d = document.createElement("details");
			const sm = document.createElement("summary");
			sm.textContent = `输出 ${t.length} 字符（点开查看）`;
			d.appendChild(sm);
			d.appendChild(mkPre(t));
			body.appendChild(d);
		} else {
			body.appendChild(mkPre(t));
		}
		if (isError) { toolClass(id, "err"); toolState(id, "error", "err"); }
		else { toolClass(id, "ok"); }
		scroll();
	}

	function textFromContent(content) {
		if (typeof content === "string") return content;
		if (!Array.isArray(content)) return "";
		return content.filter(b => b && b.type === "text").map(b => b.text).join("\n");
	}

	// ---------- history replay ----------
	function renderHistory(entries) {
		for (const e of entries) {
			if (e.kind !== "message") {
				if (e.kind === "compaction") note(`— 会话压缩：${e.tokensBefore ?? "?"} tok —`);
				else if (e.kind === "branch_summary") note("— 分支摘要 —");
				else if (e.kind === "model_change") note(`模型切换 → ${e.provider}/${e.modelId}`);
				else if (e.kind === "session_info" && e.name) note(`会话命名：${e.name}`);
				else if (e.kind === "custom_message" && e.display) note(`[${e.customType}] ${e.text}`);
				continue;
			}
			const m = e.message;
			if (!m) continue;
			if (m.role === "user") renderUser(m);
			else if (m.role === "assistant") renderAssistant(m, true);
			else if (m.role === "toolResult") fillToolResult(m.toolCallId, m.text, m.isError);
			else if (m.role === "custom") renderCustom(m);
			else if (m.role === "bashExecution") note(`$ ${m.command}`);
		}
	}

	// ---------- theme sync ----------
	function applyTheme(theme) {
		if (!theme || !theme.colors) return;
		const r = document.documentElement.style;
		const map = {
			text: "--text", muted: "--muted", dim: "--dim", accent: "--accent",
			success: "--success", error: "--error", warning: "--warning",
			border: "--border", userMessageBg: "--user-bg", userMessageText: "--user-text",
			toolTitle: "--tool-title", toolOutput: "--tool-output",
			toolPendingBg: "--tool-pending-bg", toolSuccessBg: "--tool-success-bg", toolErrorBg: "--tool-error-bg",
			thinkingText: "--thinking", mdCodeBlock: "--code-bg",
		};
		for (const [k, v] of Object.entries(map)) {
			if (theme.colors[k]) r.setProperty(v, theme.colors[k]);
		}
		if (theme.colors.text && theme.colors.text.toLowerCase() === "#ffffff" && !theme.colors.bg) {
			// light-on-dark text heuristics left to theme; keep panel default
		}
	}

	// ---------- websocket ----------
	function connect() {
		const proto = location.protocol === "https:" ? "wss:" : "ws:";
		ws = new WebSocket(`${proto}//${location.host}`);
		ws.onopen = () => {
			backoff = 2000;
			connEl.classList.add("on");
			metaEl.textContent = "connected";
			subscribe();
		};
		ws.onclose = async () => {
			connEl.classList.remove("on");
			metaEl.textContent = "disconnected, checking session…";
			// A rejected handshake (401/403) looks like a plain close to the browser,
			// so ask the server whether we still hold a session.
			try {
				const r = await fetch("/api/session", { cache: "no-store" });
				const d = await r.json();
				if (!d.authed) { metaEl.textContent = "登录已失效，正在跳转…"; location.reload(); return; }
			} catch { /* offline; fall through to retry */ }
			metaEl.textContent = `disconnected, retrying in ${Math.round(backoff / 1000)}s…`;
			setTimeout(connect, backoff);
			backoff = Math.min(backoff * 2, 30000);
		};
		ws.onerror = () => { try { ws.close(); } catch {} };
		ws.onmessage = (ev) => {
			let data;
			try { data = JSON.parse(ev.data); } catch { return; }
			handle(data);
		};
	}
	function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
	function subscribe() { send({ type: "subscribe", stream: $("streamToggle").checked }); }

	// ---------- 会话控制（命令通道）----------
	const WEB_COMMANDS = "/state /files /commands /compact /reload /new /model /thinking /tools /help";
	function fmt(n) { return typeof n === "number" ? n.toLocaleString("en-US") : "—"; }
	function runCmd(action, arg, needsConfirm, label) {
		if (!ws || ws.readyState !== 1) { note("⚠ 未连接，无法执行命令"); return; }
		if (needsConfirm && !confirm(`确定执行：${label}？`)) return;
		send({ type: "command", action, arg: arg || "", id: Date.now(), confirm: true });
	}
	function refreshState() { send({ type: "command", action: "state", id: Date.now() }); }
	function refreshModels() { send({ type: "command", action: "models", id: Date.now() }); }
	function handleSlash(text) {
		const m = /^\/(\w+)\s*(.*)$/.exec(text);
		if (!m) return false;
		const name = m[1].toLowerCase();
		const arg = m[2].trim();
		switch (name) {
			case "state": case "ctx": refreshState(); return true;
			case "commands": send({ type: "command", action: "commands", id: Date.now() }); return true;
			case "files": send({ type: "command", action: "files", id: Date.now() }); return true;
			case "compact": runCmd("compact", arg, false, "压缩当前会话上下文"); return true;
			case "reload": runCmd("reload", "", true, "重载扩展/技能/提示/主题"); return true;
			case "new": runCmd("new", "", true, "开启新会话（旧会话仍保留在磁盘）"); return true;
			case "model":
				if (!arg) refreshModels(); else runCmd("model_set", arg, false, `切换到 ${arg}`);
				return true;
			case "thinking": case "think":
				if (!arg) note("用法：/thinking off|low|medium|high"); else runCmd("thinking_set", arg, false, `思考强度 → ${arg}`);
				return true;
			case "tools":
				if (!arg) send({ type: "command", action: "tools_get", id: Date.now() }); else runCmd("tools_set", arg, false, `设置工具集：${arg}`);
				return true;
			case "help": note(`网页端命令：${WEB_COMMANDS}；以 ! 开头走 exec（需配置文件开 allowExec）`); return true;
			default: note(`网页端不认 /${name}。可用：${WEB_COMMANDS}`); return true;
		}
	}
	function renderState(st) {
		if (!st) return;
		const u = st.usage || {};
		let pct = null;
		if (typeof u.tokens === "number" && u.contextWindow) pct = (u.tokens / u.contextWindow) * 100;
		else if (typeof u.percent === "number") pct = u.percent <= 1 ? u.percent * 100 : u.percent;
		ctxEl.textContent = `ctx ${fmt(u.tokens)}/${fmt(u.contextWindow)}${pct === null ? "" : ` (${pct.toFixed(1)}%)`}`;
		if (st.model) metaEl.textContent = `${st.model.provider || "?"}/${st.model.name || st.model.id}`;
		if (st.thinking) thinkSel.value = st.thinking;
	}
	function renderModels(models, d = {}) {
		const cur = modelSel.dataset.current || "";
		modelSel.innerHTML = '<option value="">模型…</option>';
		for (const m of models) {
			const key = `${m.provider}/${m.id}`;
			const o = document.createElement("option");
			o.value = key;
			o.textContent = `${key}${m.contextWindow ? ` · ${Math.round(m.contextWindow / 1000)}K` : ""}`;
			if (key === cur) o.selected = true;
			modelSel.appendChild(o);
		}
		note(`可用模型 ${models.length} 个（来源：${d.source === "available" ? "有凭据" : "全部注册表"}${d.total && d.total > models.length ? `，共 ${d.total}` : ""}）`);
	}
	function noteCmd(d) {
		if (d.ok) {
			const extra = d.note ? `：${d.note}` : d.started ? "（已开始）" : (typeof d.code === "number" ? ` exit=${d.code}` : "");
			note(`✓ ${d.action}${extra}`);
			if (typeof d.stdout === "string" && d.stdout) addMsg("note", `<pre>${esc(d.stdout)}</pre>`);
			if (d.tools) note(`当前工具：${d.tools.join(", ")}`);
			if (d.thinking) note(`思考强度：${d.thinking}`);
		} else {
			note(`⚠ ${d.action} 失败：${d.error || "未知原因"}`);
		}
	}

	function handle(d) {
		switch (d.type) {
			case "hello": {
				const bits = [];
				if (d.model) bits.push(`${d.model.provider ?? "?"}/${d.model.name ?? d.model.id}`);
				if (d.cwd) bits.push(d.cwd);
				if (d.email) bits.push(d.email);
				if (d.sessionId) bits.push(`session ${String(d.sessionId).slice(0, 8)}`);
				metaEl.textContent = bits.join(" · ") || "connected";
				if (d.theme) applyTheme(d.theme);
				break;
			}
			case "theme": applyTheme(d.theme); break;
			case "history": resetStream(); renderHistory(d.entries ?? []); if (d.truncated) note(`… 仅显示最近 ${d.entries?.length ?? 0}/${d.total} 条 …`); break;
			case "history_end": note("— 已连入实时流 —"); refreshState(); refreshModels(); break;
			case "input": if (d.source === "interactive") { /* handled via message_start below */ } break;
			case "message_start": {
				const m = d.message;
				if (!m) break;
				if (m.role === "assistant" && $("streamToggle").checked) {
					liveBubble(true);
				} else if (m.role === "toolResult") {
					fillToolResult(m.toolCallId, m.text, m.isError);
				}
				break;
			}
			case "stream": {
				const el = liveBubble(Boolean(d.textDelta || d.thinkingDelta));
				if (!el) break;
				if (d.thinkingDelta) el._think += d.thinkingDelta;
				if (d.textDelta) el._text += d.textDelta;
				renderLive();
				break;
			}
			case "message_end": {
				const m = d.message;
				if (!m) break;
				if (m.role === "assistant") { closeLive(); renderAssistant(m, true); }
				else if (m.role === "toolResult") fillToolResult(m.toolCallId, m.text, m.isError);
				else if (m.role === "user") renderUser(m);
				else if (m.role === "custom") renderCustom(m);
				else if (m.role === "bashExecution") note(`$ ${m.command} → exit ${m.exitCode ?? "?"}`);
				break;
			}
			case "tool_call": ensureTool(d.toolCallId, d.toolName, (() => { try { return JSON.stringify(d.input, null, 2); } catch { return String(d.input); } })()); toolState(d.toolCallId, "ready"); break;
			case "tool_execution_start": toolState(d.toolCallId, "running…"); break;
			case "tool_execution_end": {
				const dur = d.durationMs != null ? ` ${(d.durationMs / 1000).toFixed(1)}s` : "";
				toolState(d.toolCallId, (d.isError ? "error" : "done") + dur, d.isError ? "err" : "");
				if (d.isError) toolClass(d.toolCallId, "err"); else toolClass(d.toolCallId, "ok");
				break;
			}
			case "tool_result": {
				const text = textFromContent(d.content);
				fillToolResult(d.toolCallId, text, d.isError);
				break;
			}
			case "agent_start": note("▶ agent 开始"); break;
			case "agent_settled": note(d.aborted ? "■ agent 中止" : "■ agent 完成"); break;
			case "model_select": if (d.model) { metaEl.textContent = `${d.model.provider ?? "?"}/${d.model.name ?? d.model.id}`; modelSel.dataset.current = `${d.model.provider}/${d.model.id}`; refreshState(); } break;
			case "session_start": note(`— session start (${d.reason}) —`); break;
			case "session_info_changed": if (d.name) note(`会话命名：${d.name}`); break;
			case "subscribed": note(`订阅模式：${d.stream ? "流式 token" : "消息级"}`); break;
			case "ack": break;
			case "error": note(`⚠ ${d.error}`); break;
			case "pong": break;
			case "state": renderState(d.state); break;
			case "models": renderModels(d.models ?? [], d); break;
			case "commands": note(`会话内命令：${(d.commands ?? []).map((c) => "/" + c.name).join(" ")}`); break;
			case "command_result": noteCmd(d); break;
			case "session_compact": note(`— 上下文已压缩（压缩前 ${fmt(d.tokensBefore)} tokens，summary ${fmt(d.summaryChars)} 字符）—`); refreshState(); break;
			case "session_compact_failed": note(`⚠ 压缩失败：${d.errorMessage || (d.aborted ? "已取消" : "") || d.reason || "未知原因"}`); break;
			case "thinking_level_select": if (d.level) thinkSel.value = d.level; break;
			case "file_ready": renderFileCard(d); break;
			case "files": renderFileList(d); break;
		}
	}

	// ---------- attachments ----------
	const MAX_UPLOAD = 8 * 1024 * 1024;
	const pending = new Map();
	function renderChips() {
	const box = $("chips");
	box.innerHTML = "";
	for (const f of pending.values()) {
		const chip = document.createElement("span");
		chip.className = "chip";
		const kb = typeof f.size === "number" ? (f.size / 1024).toFixed(0) + " KB" : "";
		chip.innerHTML = `<b>${esc(f.name)}</b><span>${esc(kb)}</span>`;
		const x = document.createElement("button");
		x.textContent = "×";
		x.title = "移除";
		x.addEventListener("click", () => { pending.delete(f.id); renderChips(); });
		chip.appendChild(x);
		box.appendChild(chip);
	}
	}
	async function uploadFiles(list) {
	for (const f of list) {
		if (!f) continue;
		if (f.size > MAX_UPLOAD) { note(`⚠ ${f.name} 超过 ${Math.round(MAX_UPLOAD / 1024 / 1024)} MB，未上传`); continue; }
		note(`上传中：${f.name} …`);
		try {
			const r = await fetch("/api/upload", {
				method: "POST",
				headers: { "content-type": f.type || "application/octet-stream", "x-file-name": encodeURIComponent(f.name) },
				body: f,
			});
			const j = await r.json().catch(() => ({}));
			if (!j.ok) { note(`⚠ 上传失败 ${f.name}：${j.error || r.status}`); continue; }
			pending.set(j.id, j);
			note(`已上传：${j.name}（${j.kind === "image" ? "图片直接进模型" : "路径引用"}）`);
		} catch (e) { note(`⚠ 上传失败 ${f.name}：${e && e.message ? e.message : e}`); }
	}
	renderChips();
	}
	$("attach").addEventListener("click", () => $("filePick").click());
	$("filePick").addEventListener("change", (e) => { uploadFiles(Array.from(e.target.files || [])); e.target.value = ""; });
	inputEl.addEventListener("paste", (e) => {
		const items = Array.from((e.clipboardData && e.clipboardData.items) || []).filter((i) => i.kind === "file");
		if (!items.length) return;
		e.preventDefault();
		uploadFiles(items.map((i) => i.getAsFile()).filter(Boolean));
	});
	function renderFileCard(d) {
	const url = d.url || `/f/${d.id}`;
	const kb = typeof d.size === "number" ? ` ${(d.size / 1024).toFixed(1)} KB` : "";
	if (d.kind === "image") {
		const el = addMsg("assistant", `<div class="model-tag">📷 ${esc(d.name || "")}${esc(kb)}</div><img src="${esc(url)}" alt="${esc(d.name || "")}" loading="eager"><div class="sub"><a href="${esc(url)}" download>下载原图</a></div>`);
		el.classList.add("filecard");
	} else {
		const el = document.createElement("div");
		el.className = "filecard";
		el.innerHTML = `<div class="model-tag">📦 ${esc(d.name || "")}${esc(kb)}</div><a href="${esc(url)}" download>下载文件</a>`;
		streamEl.appendChild(el);
		scroll();
	}
	}
	function renderFileList(d) {
	const list = d.files || [];
	if (!list.length) { note("文件存储为空"); return; }
	const s = d.stats || {};
	note(`${list.length} 个文件${s.bytes ? ` · ${(s.bytes / 1024 / 1024).toFixed(1)} MB` : ""}`);
	for (const f of list) renderFileCard(f);
	}

	// ---------- input ----------
	function doSend() {
		const text = inputEl.value.trim();
		const atts = Array.from(pending.keys());
		if (!text && !atts.length) return;
		if (text.startsWith("!")) {
			send({ type: "command", action: "exec", arg: text.slice(1).trim(), id: Date.now() });
			inputEl.value = "";
			return;
		}
		if (text.startsWith("/")) {
			handleSlash(text);
			inputEl.value = "";
			return;
		}
		send({ type: "user_message", text, deliverAs: $("deliverAs").value, attachments: atts });
		if (atts.length) {
			const names = atts.map((id) => (pending.get(id) || {}).name).filter(Boolean);
			note(`已附上：${names.join(", ")}`);
			pending.clear();
			renderChips();
		}
		inputEl.value = "";
	}
	$("send").addEventListener("click", doSend);
	inputEl.addEventListener("keydown", (e) => {
		if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); doSend(); }
	});
	$("streamToggle").addEventListener("change", subscribe);
	$("clear").addEventListener("click", resetStream);
	const logoutBtn = $("logout");
	if (logoutBtn) logoutBtn.addEventListener("click", async () => {
		try { await fetch("/api/logout", { method: "POST" }); } catch { /* ignore */ }
		location.reload();
	});

	setInterval(() => send({ type: "ping", id: Date.now() }), 30000);
	$("btnState").addEventListener("click", refreshState);
	$("btnCompact").addEventListener("click", () => runCmd("compact", "", false, "压缩当前会话上下文"));
	$("btnReload").addEventListener("click", () => runCmd("reload", "", true, "重载扩展/技能/提示/主题"));
	$("btnNew").addEventListener("click", () => runCmd("new", "", true, "开启新会话（旧会话仍保留在磁盘）"));
	thinkSel.addEventListener("change", () => { if (thinkSel.value) runCmd("thinking_set", thinkSel.value, false, `思考强度 → ${thinkSel.value}`); });
	modelSel.addEventListener("change", () => { if (modelSel.value) runCmd("model_set", modelSel.value, false, `切换到 ${modelSel.value}`); });
	connect();
})();
</script>
</body>
</html>
