<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi-websocket · 登录</title>
<style>
	:root {
		--bg: #0d0d10; --panel: #17171c; --border: #2c2c34;
		--text: #e8e8ec; --muted: #9a9aa6; --dim: #6a6a76;
		--accent: #7f77dd; --success: #1d9e75; --error: #e24b4a; --warning: #ef9f27;
		--mono: ui-monospace, "Cascadia Code", Consolas, monospace;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; margin: 0; }
	body {
		background: var(--bg); color: var(--text);
		font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", sans-serif;
		display: flex; align-items: center; justify-content: center; padding: 20px;
	}
	.card {
		width: 100%; max-width: 360px; background: var(--panel);
		border: 1px solid var(--border); border-radius: 12px; padding: 22px;
	}
	h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; letter-spacing: .02em; }
	.sub { color: var(--dim); font-size: 12px; margin: 0 0 18px; }
	label { display: block; color: var(--muted); font-size: 12px; margin: 0 0 6px; }
	input {
		width: 100%; background: #101014; color: var(--text);
		border: 1px solid var(--border); border-radius: 8px;
		padding: 10px 12px; font: inherit; outline: none;
	}
	input:focus { border-color: var(--accent); }
	input[readonly] { color: var(--muted); }
	.row { display: flex; gap: 8px; align-items: stretch; }
	.row input { flex: 1; }
	button {
		background: #232338; color: var(--text); border: 1px solid var(--border);
		border-radius: 8px; padding: 10px 14px; font: inherit; cursor: pointer; white-space: nowrap;
	}
	button:hover:not(:disabled) { border-color: var(--accent); }
	button:disabled { opacity: .45; cursor: not-allowed; }
	button.primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; margin-top: 14px; }
	.field { margin-bottom: 14px; }
	#status { min-height: 20px; font-size: 12px; margin-top: 12px; color: var(--muted); }
	#status.err { color: var(--error); }
	#status.ok { color: var(--success); }
	.hint { color: var(--dim); font-size: 11px; margin-top: 14px; }
	code { font-family: var(--mono); font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<form class="card" id="form" autocomplete="on">
	<h1>pi-websocket</h1>
	<p class="sub">需要登录后才能查看/驱动 pi 会话。验证码会发到已授权邮箱。</p>

	<div class="field">
		<label for="email">邮箱</label>
		<input id="email" type="email" name="email" inputmode="email" placeholder="you@example.com" required>
	</div>

	<div class="field">
		<label for="code">验证码</label>
		<div class="row">
			<input id="code" type="text" name="code" inputmode="numeric" autocomplete="one-time-code"
			       maxlength="6" pattern="[0-9]*" placeholder="6 位数字">
			<button type="button" id="send">获取验证码</button>
		</div>
	</div>

	<button class="primary" type="submit" id="submit">登录</button>
	<div id="status" role="status" aria-live="polite"></div>
	<div class="hint">仅允许配置中的邮箱登录。验证码、登录会话与限流状态由当前 Pi 进程独立管理。</div>
</form>

<script>
"use strict";
(() => {
	const $ = (id) => document.getElementById(id);
	const statusEl = $("status");
	let cooldown = 0, timer = null;

	function say(text, kind) {
		statusEl.textContent = text || "";
		statusEl.className = kind || "";
	}

	async function post(path, body) {
		const r = await fetch(path, {
			method: "POST",
			headers: { "content-type": "application/json" },
			body: JSON.stringify(body || {}),
			cache: "no-store",
		});
		let d = {};
		try { d = await r.json(); } catch { /* non-JSON */ }
		return { status: r.status, d };
	}

	function tick() {
		cooldown -= 1;
		const b = $("send");
		if (cooldown > 0) { b.disabled = true; b.textContent = `重发 ${cooldown}s`; return; }
		b.disabled = false; b.textContent = "获取验证码";
		clearInterval(timer); timer = null;
	}

	function startCooldown(sec) {
		cooldown = sec;
		if (timer) clearInterval(timer);
		tick();
		timer = setInterval(tick, 1000);
	}

	$("send").addEventListener("click", async () => {
		const email = $("email").value.trim();
		if (!email) { say("请先填邮箱", "err"); $("email").focus(); return; }
		$("send").disabled = true;
		say("正在发送…");
		try {
			const { d } = await post("/api/login/start", { email });
			if (d.ok) {
				say("验证码已发送，请查收邮箱（3 分钟内有效）", "ok");
				$("code").focus();
				startCooldown(60);
			} else {
				const m = String(d.error || "");
				const cd = m.match(/请\s*(\d+)\s*s\s*后重试/);
				if (cd) startCooldown(Number(cd[1]));
				else $("send").disabled = false;
				say(m || "发送失败", "err");
			}
		} catch (e) {
			$("send").disabled = false;
			say("网络错误：" + e.message, "err");
		}
	});

	$("form").addEventListener("submit", async (e) => {
		e.preventDefault();
		const email = $("email").value.trim();
		const code = $("code").value.trim();
		if (!email || !code) { say("请填邮箱和验证码", "err"); return; }
		$("submit").disabled = true;
		say("正在验证…");
		try {
			const { status, d } = await post("/api/login/verify", { email, code });
			if (d.ok) {
				say("登录成功，正在进入…", "ok");
				location.replace("/");
				return;
			}
			say(d.error || `验证失败 (HTTP ${status})`, "err");
		} catch (err) {
			say("网络错误：" + err.message, "err");
		} finally {
			$("submit").disabled = false;
		}
	});

	// Already logged in? Go straight to the client.
	fetch("/api/session", { cache: "no-store" })
		.then((r) => r.json())
		.then((d) => { if (d.authed) location.replace("/"); })
		.catch(() => {});
})();
</script>
</body>
</html>
